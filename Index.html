    <script>
      var loggedInUser = null;
      var roleTasks = [], extraTasks = [], orderTasks = [];
      var currentActiveTab = 'Daily';
      var selectedTaskObj = null; 
      var lastOrderCount = -1; 
      var passedEmpId = "<?= portalEmpId ?>";

      window.onload = function() {
        if (passedEmpId && passedEmpId.trim() !== "") {
          document.getElementById('empId').value = passedEmpId;
          document.getElementById('empPass').value = "SSO_BYPASS";
          loginUser();
        }
      };

      function loginUser() {
        var id = document.getElementById("empId").value.trim();
        var pass = document.getElementById("empPass").value.trim();
        if(!id || !pass) { document.getElementById("loginMsg").innerText = "Kripya ID aur Password bharein!"; return; }
        document.getElementById("loginMsg").innerText = "Authenticating & Loading Portal...";

        google.script.run.withSuccessHandler(function(res) {
          if(res.success) {
            loggedInUser = { name: res.name, role: res.role };
            document.getElementById("loginScreen").classList.add("hidden");
            var roleClean = res.role.toLowerCase().trim();
            if (roleClean === "admin" || roleClean === "owner") {
              document.getElementById("adminPortal").classList.remove("hidden");
              loadAdminDropdown();
              loadAdminHistory();
            } else {
              document.getElementById("staffPortal").classList.remove("hidden");
              document.getElementById("staffNameDisplay").innerText = "Hello, " + res.name;
              document.getElementById("staffRoleDisplay").innerText = "🏆 Role: " + res.role;
              document.getElementById('lblRewardPoints').innerText = (res.totalPoints || 0) + " Pts";

              if(roleClean === "store manager") {
                if(!document.getElementById("orderTabBtn")) {
                  document.getElementById("navTabs").innerHTML += '<div id="orderTabBtn" class="tab" onclick="switchTab(\'Orders\', this)" style="color:#2ea043;">📦 Orders</div>';
                }
              }
              loadStaffDashboard();
            }
          } else { document.getElementById("loginMsg").innerText = res.message; }
        }).verifyLogin(id, pass);
      }

      function logout() {
        loggedInUser = null;
        document.getElementById("adminPortal").classList.add("hidden");
        document.getElementById("staffPortal").classList.add("hidden");
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("empId").value = "";
        document.getElementById("empPass").value = "";
        document.getElementById("loginMsg").innerText = "";
        window.history.pushState({}, document.title, window.location.pathname);
      }

      function switchAdminTab(tabName) {
        document.getElementById('tabBtnAssign').classList.remove('active');
        document.getElementById('tabBtnProgress').classList.remove('active');
        document.getElementById('tabBtnHistory').classList.remove('active');
        document.getElementById('adminTabAssign').classList.add('hidden');
        document.getElementById('adminTabProgress').classList.add('hidden');
        document.getElementById('adminTabHistory').classList.add('hidden');
        document.getElementById('tabBtn' + tabName).classList.add('active');
        document.getElementById('adminTab' + tabName).classList.remove('hidden');
      }

      function loadAdminDropdown() {
        google.script.run.withSuccessHandler(function(list) {
          var selA = document.getElementById("adminStaffSelect");
          var selV = document.getElementById("adminViewStaffSelect");
          selA.innerHTML = '<option value="">-- Staff / Team Chunein --</option>';
          selV.innerHTML = '<option value="">-- Kiski Report dekhni hai? --</option>';
          for(var i=0; i<list.length; i++) {
            selA.options.add(new Option(list[i], list[i]));
            if(list[i].includes("👤")) selV.options.add(new Option(list[i], list[i]));
          }
        }).getStaffListForAdmin();
      }

      function formatDateTimeLocal(dateTimeVal) {
        if (!dateTimeVal) return "";
        var d = new Date(dateTimeVal);
        if (isNaN(d.getTime())) return dateTimeVal.replace(/\s*GMT.*/i, '').trim();
        var options = { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true };
        return d.toLocaleString('en-US', options).replace(/\s*GMT.*/i, '').trim();
      }

      function sendAdhocTask() {
        var staff = document.getElementById("adminStaffSelect").value;
        var typeVal = document.getElementById("adminTaskFrequency").value;
        var desc = document.getElementById("adminAdhocTask").value;
        var rawDeadline = document.getElementById("adminAdhocDeadline").value;
        var dead = formatDateTimeLocal(rawDeadline); 
        var photoInput = document.getElementById("adminTaskPhotoFile");

        if(!staff || !desc) { alert("Staff aur Task bharana zaroori hai!"); return; }

        if (photoInput.files.length > 0) {
          var file = photoInput.files[0];
          var reader = new FileReader();
          reader.onload = function(e) {
            var base64Data = e.target.result.split(',')[1];
            document.getElementById("adminMsg").innerText = "Assigning with photo...";
            google.script.run.withSuccessHandler(function(res) {
              document.getElementById("adminMsg").innerText = res;
              document.getElementById("adminAdhocTask").value = "";
              document.getElementById("adminAdhocDeadline").value = "";
              photoInput.value = "";
              setTimeout(function() { document.getElementById("adminMsg").innerText = ""; }, 3500);
              loadAdminHistory(); 
            }).assignAdhocTask(staff, typeVal, desc, dead, base64Data, file.type, file.name);
          };
          reader.readAsDataURL(file);
        } else {
          google.script.run.withSuccessHandler(function(res) {
            document.getElementById("adminMsg").innerText = res;
            document.getElementById("adminAdhocTask").value = "";
            document.getElementById("adminAdhocDeadline").value = "";
            setTimeout(function() { document.getElementById("adminMsg").innerText = ""; }, 3500);
            loadAdminHistory(); 
          }).assignAdhocTask(staff, typeVal, desc, dead, null, null, null);
        }
      }

      function fetchStaffProgress() {
        var sel = document.getElementById("adminViewStaffSelect").value;
        if(!sel) { document.getElementById("staffProgressContent").innerHTML = ""; return; }
        var cleanName = sel.replace("👤 ", "").trim();
        document.getElementById("staffProgressContent").innerHTML = "<p style='color:#8b949e; text-align:center;'>Progress report nikal rahe hain...</p>";
        google.script.run.withSuccessHandler(function(res) {
          var html = "<div style='background:#1f242c; padding:10px; border-radius:6px; margin-bottom:15px; border-left:4px solid #58a6ff;'>";
          html += "<b style='color:#c9d1d9;'>" + cleanName + "</b> <span style='font-size:12px; color:#8b949e;'>(Role: " + res.role + ")</span></div>";
          html += "<h4 style='color:#58a6ff; margin-bottom:10px; margin-top:0;'>📋 Permanent Routine Tasks</h4>";
          if(res.routine.length === 0) html += "<p style='font-size:13px; color:#8b949e;'>Koi routine task nahi hai.</p>";
          var groupedTasks = {};
          for(var i=0; i<res.routine.length; i++) {
            var t = res.routine[i];
            if(!groupedTasks[t.task]) groupedTasks[t.task] = [];
            groupedTasks[t.task].push(t);
          }
          for(var mainTask in groupedTasks) {
            html += "<div class='subtask-container' style='margin-bottom:10px;'>";
            html += "<div class='subtask-name' style='color:#c9d1d9; font-weight:bold; margin-bottom:8px;'>" + mainTask + "</div>";
            var group = groupedTasks[mainTask];
            for(var j=0; j<group.length; j++) {
               var st = group[j];
               var stName = st.subTask || "Main Task";
               var isDone = st.status.includes("Uploaded") || st.status.includes("Completed") || st.status.includes("Skipped");
               var cColor = st.status.includes("Skipped") ? "#da3633" : (isDone ? "#2ea043" : "#e67e22");
               html += "<div class='subtask-row' style='padding:8px;'>";
               html += "<div class='subtask-name' style='font-size:12px; margin-bottom:0; " + (isDone ? "text-decoration:line-through; color:#8b949e;" : "") + "'>" + stName + "</div>";
               html += "<div class='status-text' style='font-size:11px; color:" + cColor + "; text-align:left; margin-top:2px;'>" + st.status + "</div>";
               html += "</div>";
            }
            html += "</div>";
          }
          html += "<h4 style='color:#ffd33d; margin-top:20px; margin-bottom:10px;'>🔔 Extra / Assigned Tasks</h4>";
          if(res.adhoc.length === 0) html += "<p style='font-size:13px; color:#8b949e;'>Inko koi extra task assign nahi kiya gaya hai.</p>";
          for(var i=0; i<res.adhoc.length; i++) {
             var at = res.adhoc[i];
             var isDone = at.status.includes("Uploaded") || at.status.includes("Completed") || at.status.includes("Skipped");
             var cColor = at.status.includes("Skipped") ? "#da3633" : (isDone ? "#2ea043" : "#e67e22");
             html += "<div class='subtask-container' style='margin-bottom:10px; border-left: 4px solid #e67e22;'>";
             html += "<div class='subtask-name' style='font-size:13px; margin-bottom:0; " + (isDone ? "text-decoration:line-through; color:#8b949e;" : "") + "'>" + at.task + "</div>";
             if(at.refPhoto && at.refPhoto !== "No Photo") {
               html += "<div style='margin:5px 0;'><a href='" + at.refPhoto.replace('=HYPERLINK("', '').split('",')[0] + "' target='_blank' style='font-size:11px; color:#58a6ff;'>📷 View Reference Photo</a></div>";
             }
             html += "<div class='status-text' style='margin-top:2px; font-size:11px; color:" + cColor + "; text-align:left;'>" + at.status + "</div>";
             html += "</div>";
          }
          document.getElementById("staffProgressContent").innerHTML = html;
        }).getStaffProgressReport(cleanName);
      }

      function loadAdminHistory() {
        document.getElementById("adminHistoryContent").innerHTML = "<p style='color:#8b949e; text-align:center;'>History load ho rahi hai...</p>";
        google.script.run.withSuccessHandler(function(history) {
          var html = "";
          if(history.length === 0) html = "<p style='text-align:center; color:#8b949e;'>Koi task history nahi hai.</p>";
          else {
             for(var i=0; i<history.length; i++) {
                var h = history[i];
                var isDone = h.status.includes("Completed") || h.status.includes("Uploaded") || h.status.includes("Skipped");
                var sColor = h.status.includes("Skipped") ? "#da3633" : (isDone ? "#2ea043" : "#e67e22");
                html += "<div style='background:#1f242c; padding:12px; border-radius:8px; border-left:4px solid "+sColor+"; margin-bottom:10px;'>";
                html += "<p style='margin:0 0 5px 0; font-size:11px; color:#8b949e;'>📅 Assign Date: " + h.date + "</p>";
                html += "<p style='margin:0 0 5px 0; font-size:14px; font-weight:bold; color:#c9d1d9;'>👤 " + h.assignedTo + "</p>";
                html += "<p style='margin:0 0 8px 0; font-size:13px; color:#58a6ff;'>" + h.task + "</p>";
                html += "<p style='margin:0; font-size:12px; font-weight:bold; color:" + sColor + ";'>Status: " + h.status + "</p>";
                html += "</div>";
             }
          }
          document.getElementById("adminHistoryContent").innerHTML = html;
        }).getAllAdhocHistory();
      }

      function switchTab(tabName, el) {
        currentActiveTab = tabName;
        var tabs = document.querySelectorAll('.tab');
        for(var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
        if(el) el.classList.add('active');
        if(tabName === 'Orders') document.getElementById("notificationBanner").style.display = "none";
        renderStaffContent(); 
      }

      // 📌 FIXED: Passes loggedInUser.name to check today's completed tasks in Task_Submissions
      function loadStaffDashboard() {
        document.getElementById("tabContentArea").innerHTML = "<div class='card' style='text-align:center; color:#8b949e;'>Tasks load ho rahe hain...</div>";
        google.script.run.withSuccessHandler(function(tasks) { 
            roleTasks = tasks || []; 
            google.script.run.withSuccessHandler(function(adhocs) { 
                extraTasks = adhocs || []; 
                if (loggedInUser.role.toLowerCase().trim() === "store manager") {
                  google.script.run.withSuccessHandler(function(orders) { 
                    orderTasks = orders || []; 
                    renderStaffContent(); 
                  }).getLiveOrdersForManager();
                } else {
                  renderStaffContent(); 
                }
            }).getAdhocTasksForStaff(loggedInUser.name);
        }).getTasksForRole(loggedInUser.role, loggedInUser.name);
      }

      function parseDeadline(deadlineStr) {
        if (!deadlineStr || deadlineStr === "N/A" || deadlineStr === "Jald") return null;
        var d = new Date(deadlineStr);
        if (!isNaN(d.getTime())) return d;
        var match = deadlineStr.match(/(\d+):(\d+)\s(AM|PM)/i);
        if (match) {
          var dToday = new Date();
          var hrs = parseInt(match[1]);
          var mins = parseInt(match[2]);
          var ampm = match[3].toUpperCase();
          if (ampm === "PM" && hrs < 12) hrs += 12;
          if (ampm === "AM" && hrs === 12) hrs = 0;
          dToday.setHours(hrs, mins, 0, 0);
          return dToday;
        }
        return null;
      }

      function updateLiveTimers() {
        var timers = document.querySelectorAll('.live-timer');
        var now = new Date();
        timers.forEach(function(el) {
          var isComp = el.getAttribute('data-completed') === 'true';
          if (isComp) { el.innerHTML = ""; return; }
          var deadStr = el.getAttribute('data-deadline');
          var deadDate = parseDeadline(deadStr);
          if (!deadDate) { el.innerHTML = ""; return; }
          
          var diffMs = deadDate - now;
          var isOverdue = diffMs < 0;
          var absDiff = Math.abs(diffMs);
          var hrs = Math.floor(absDiff / (1000 * 60 * 60));
          var mins = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60));
          
          if (isOverdue) {
              el.innerHTML = `<span style="color:white; font-size:11px; background:#da3633; padding:2px 6px; border-radius:4px; margin-left:5px;">🚨 Overdue: ${hrs}h ${mins}m</span>`;
          } else {
              el.innerHTML = `<span style="color:white; font-size:11px; background:#e67e22; padding:2px 6px; border-radius:4px; margin-left:5px;">⏳ Left: ${hrs}h ${mins}m</span>`;
          }
        });
      }
      setInterval(updateLiveTimers, 10000); 

      function renderStaffContent() {
        var isOwner = (loggedInUser.role.toLowerCase().trim() === "owner" || loggedInUser.role.toLowerCase().trim() === "admin");
        
        var counts = { Daily: {t:0, d:0}, Weekly: {t:0, d:0}, Monthly: {t:0, d:0} };
        for(var k=0; k<roleTasks.length; k++) {
            var tItem = roleTasks[k];
            if(counts[tItem.type]) {
                counts[tItem.type].t++;
                if(tItem.status.includes("Uploaded") || tItem.status.includes("Completed") || tItem.status.includes("Skipped")) { counts[tItem.type].d++; }
            }
        }

        var tD = document.getElementById("tabDaily");
        if(tD) tD.innerHTML = "Daily (" + counts.Daily.d + "/" + counts.Daily.t + ")";
        var tW = document.getElementById("tabWeekly");
        if(tW) tW.innerHTML = "Weekly (" + counts.Weekly.d + "/" + counts.Weekly.t + ")";
        var tM = document.getElementById("tabMonthly");
        if(tM) tM.innerHTML = "Monthly (" + counts.Monthly.d + "/" + counts.Monthly.t + ")";
        
        var adhocBtn = document.getElementById("adhocTabBtn");
        if(adhocBtn) {
           var adhocPending = extraTasks.filter(function(e){ return !e.status.includes("Uploaded") && !e.status.includes("Completed") && !e.status.includes("Skipped"); }).length;
           adhocBtn.innerHTML = "🔔 Extra Tasks (" + adhocPending + ")";
        }

        var area = document.getElementById("tabContentArea");
        var html = "";
        var count = 0;

        if (currentActiveTab === 'Orders') {
          if(orderTasks.length === 0) { area.innerHTML = "<div class='card' style='text-align:center; color:#8b949e;'>Aaj ke saare Orders process ho gaye hain! 🎉</div>"; updateLiveTimers(); return; }
          for(var i=0; i<orderTasks.length; i++) {
            var o = orderTasks[i];
            var isOrderCompleted = o.status.includes("Completed");
            html += "<div class='task-card order' " + (isOrderCompleted ? "style='opacity:0.6;'" : "") + ">";
            html += "<div style='display:flex; justify-content:space-between; align-items:center;'><p style='margin:0; font-size:16px; font-weight:bold; color:#2ea043; " + (isOrderCompleted ? "text-decoration:line-through;" : "") + "'>📦 Order: " + o.orderId + "</p><span style='font-size:11px; background:#2ea043; color:white; padding:3px 8px; border-radius:12px;'>⏱️ " + o.orderTime + "</span></div>";
            html += "<p style='margin:8px 0 5px 0; font-size:14px; color:#c9d1d9;'><b>Shop:</b> " + o.shopName + "</p>";
            html += "<p style='margin:5px 0; font-size:13px; color:#8b949e; background:#0d1117; padding:8px; border-radius:6px;'><b>Items to Pack:</b><br>" + o.items + "</p>";
            if (isOrderCompleted) { html += "<p style='margin:10px 0 0 0; font-size:14px; font-weight:bold; color:#2ea043; text-align:center;'>" + o.status + "</p>"; } 
            else { html += "<button style='background:#2ea043; color:white; width:100%; font-size:14px; padding:10px; margin-top:10px;' onclick='confirmAndCompleteOrder(" + i + ", " + o.rowIndex + ", this)'>✅ Confirm & Process</button>"; }
            html += "</div>";
          }
        } 
        else if (currentActiveTab === 'Adhoc') {
          if(extraTasks.length === 0) { area.innerHTML = "<div class='card' style='text-align:center; color:#8b949e;'>Koi extra task nahi hai! 🎉</div>"; updateLiveTimers(); return; }
          for(var i=0; i<extraTasks.length; i++) {
            var t = extraTasks[i];
            var isCompleted = t.status.includes("Uploaded") || t.status.includes("Completed") || t.status.includes("Skipped");
            var isSkipped = t.status.includes("Skipped");
            html += "<div class='task-card adhoc' style='border-left-color: #e67e22; background:#1f242c;'>";
            html += "<p style='margin:0; font-size:15px; font-weight:bold; color:#ffd33d;'>🔔 Extra Task: " + t.task + "</p>";
            
            html += "<div style='background:#0d1117; padding:10px; border-radius:8px; margin: 10px 0; border:1px solid #30363d;'>";
            if (t.assignDate) { html += "<p style='margin:0 0 5px 0; font-size:11px; color:#58a6ff;'>🟢 <b>Assigned:</b> " + t.assignDate + "</p>"; }
            var displayDead = t.deadline || "Jald";
            html += "<p style='margin:0; font-size:12px; color:#ffd33d;'>⏰ <b>Deadline:</b> " + displayDead;
            html += " <span class='live-timer' data-deadline='" + displayDead + "' data-completed='" + isCompleted + "'></span>";
            html += " <span style='color:#ffd33d; font-weight:bold; float:right;'>🎯 10 Pts</span></p>";
            html += "</div>";

            if(t.refPhoto && t.refPhoto !== "No Photo") {
              var cleanUrl = t.refPhoto.replace('=HYPERLINK("', '').split('",')[0];
              var driveIdMatch = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
              var imgTag = "";
              if (driveIdMatch) {
                  var previewImgUrl = "https://drive.google.com/uc?id=" + driveIdMatch[1];
                  imgTag = "<div class='photo-hover-preview'><img src='" + previewImgUrl + "'></div>";
              }
              html += "<div class='ref-photo-container' style='position:relative; margin-bottom:10px; display:inline-block;'>";
              html += "<a href='" + cleanUrl + "' target='_blank' style='background:#1f6feb; color:white; padding:4px 8px; border-radius:4px; font-size:11px; text-decoration:none;'>📷 View Reference Photo</a>";
              html += imgTag;
              html += "</div><br>";
            }

            html += "<div class='subtask-row " + (isCompleted ? "completed" : "") + "'>";
            if(isCompleted) {
              html += "<div class='subtask-name' style='color:#8b949e; font-size:12px; margin-bottom:0;'>Status: Done</div>";
              html += "<div class='status-text' style='color:" + (isSkipped ? "#da3633" : "#2ea043") + "; text-align:left;'>" + t.status + "</div>";
            } else {
              html += "<div class='subtask-name' style='font-size:13px; color:#c9d1d9; margin-bottom:6px;'>👉 Action:</div>";
              html += "<div class='subtask-actions'>";
              html += "<button class='btn-complete' onclick='openAdhocProofModal(" + i + ")'>✅ Done</button>";
              html += "<button class='btn-capture' onclick='openAdhocProofModal(" + i + ")'>📸 Photo</button>";
              if (isOwner) {
                html += "<button class='btn-skip' onclick='skipAdhocTask(" + i + ", this)'>⏭️ Skip</button>";
              }
              html += "</div>";
            }
            html += "</div></div>";
          }
        }
        else {
          var groupedTasks = {};
          for(var i = 0; i < roleTasks.length; i++) {
            var t = roleTasks[i];
            if(t.type.toLowerCase() === currentActiveTab.toLowerCase()) {
              if(!groupedTasks[t.task]) groupedTasks[t.task] = [];
              groupedTasks[t.task].push({ data: t, index: i });
              count++;
            }
          }
          for (var mainTask in groupedTasks) {
            var group = groupedTasks[mainTask];
            var firstTask = group[0].data;
            html += "<div class='task-card'>";
            html += "<h3 style='margin:0 0 5px 0; font-size:17px; color:#58a6ff;'>📌 " + mainTask + "</h3>";
            
            var isAllDone = group.every(function(x) { return x.data.status.includes("Uploaded") || x.data.status.includes("Completed") || x.data.status.includes("Skipped"); });
            var rawDeadRoutine = firstTask.deadline || "N/A";
            html += "<div style='background:#0d1117; padding:10px; border-radius:8px; margin: 10px 0; border:1px solid #30363d;'>";
            html += "<p style='margin:0; font-size:12px; color:#ffd33d;'>⏰ <b>Deadline:</b> " + rawDeadRoutine;
            html += " <span class='live-timer' data-deadline='" + rawDeadRoutine + "' data-completed='" + isAllDone + "'></span>";
            html += " <span style='float:right;'>🎯 10 Pts</span></p>";
            html += "</div>";

            if(firstTask.sop || firstTask.sopVideo) {
              html += "<div style='display:flex; gap:6px; margin-bottom:12px;'>";
              if(firstTask.sop) html += "<button class='btn-info' style='padding:6px; font-size:11px;' onclick='openSopModal(\"" + encodeURIComponent(firstTask.sop) + "\")'>📖 View SOP</button>";
              if(firstTask.sopVideo) html += "<button class='btn-danger' style='padding:6px; font-size:11px;' onclick='openVideoModal(\"" + encodeURIComponent(firstTask.sopVideo) + "\")'>🎥 SOP Video</button>";
              html += "</div>";
            }
            
            html += "<div class='subtask-container'>";
            if(group.length > 1) {
              html += "<div class='subtask-header'>📸 CHECKLIST (" + group.length + " TASKS)</div>";
            }
            
            for(var j = 0; j < group.length; j++) {
              var st = group[j].data;
              var stIndex = group[j].index; 
              var isCompleted = st.status.includes("Uploaded") || st.status.includes("Completed") || st.status.includes("Skipped");
              var isSkipped = st.status.includes("Skipped");
              var isDone = isCompleted || isSkipped;
              
              var displayName = st.subTask ? st.subTask : "Action Details:";

              html += "<div class='subtask-row " + (isDone ? "completed" : "") + "'>";
              if(isDone) {
                html += "<div class='subtask-name' style='text-decoration: line-through; color:#8b949e; margin-bottom:0;'>" + displayName + "</div>";
                html += "<div class='status-text' style='color:" + (isSkipped ? "#da3633" : "#2ea043") + "; text-align:left; margin-top:4px;'>" + st.status + "</div>";
              } else {
                html += "<div class='subtask-name'>" + displayName + "</div>";
                html += "<div class='subtask-actions'>";
                html += "<button class='btn-complete' onclick='openStandardProofModal(" + stIndex + ")'>✅ Done</button>";
                html += "<button class='btn-capture' onclick='openStandardProofModal(" + stIndex + ")'>📸 Photo</button>";
                if (isOwner) {
                  html += "<button class='btn-skip' onclick='skipTask(" + stIndex + ", this)'>⏭️ Skip</button>";
                }
                html += "</div>";
              }
              html += "</div>";
            }
            html += "</div></div>";
          }
        }
        if(currentActiveTab !== 'Orders' && currentActiveTab !== 'Adhoc' && count === 0) html = "<div class='card' style='text-align:center; color:#8b949e;'>Is tab mein abhi koi task nahi hai! 🎉</div>";
        area.innerHTML = html;
        updateLiveTimers(); 
      }

      function updatePointsUI(pts) {
        var lbl = document.getElementById('lblRewardPoints');
        if (lbl && pts > 0) {
           var currentPts = parseInt(lbl.innerText.replace(/\D/g,'')) || 0;
           lbl.innerText = (currentPts + pts) + " Pts";
        }
      }

      function skipTask(index, btn) {
        if(confirm("Kya aap is task ko 'Skip' karna chahte hain?")) {
           var t = roleTasks[index];
           btn.innerText = "..."; btn.disabled = true;
           google.script.run.withSuccessHandler(function(res) { t.status = res.status; updatePointsUI(res.pointsEarned); renderStaffContent(); }).submitTaskWithProof(loggedInUser.name, loggedInUser.role, t.type, t.task, t.subTask, t.deadline, null, null, null, false, null, "Skip");
        }
      }
      function skipAdhocTask(index, btn) {
        if(confirm("Kya aap is extra task ko 'Skip' karna chahte hain?")) {
           var t = extraTasks[index];
           btn.innerText = "..."; btn.disabled = true;
           google.script.run.withSuccessHandler(function(res) { t.status = res.status; updatePointsUI(res.pointsEarned); renderStaffContent(); }).submitTaskWithProof(loggedInUser.name, loggedInUser.role, "Ad-hoc", t.task, "", t.deadline, null, null, null, true, t.index, "Skip");
        }
      }

      function openStandardProofModal(index) {
        selectedTaskObj = roleTasks[index];
        document.getElementById("modalHeading").innerText = "📸 Capture Proof";
        document.getElementById("modalTaskTitle").innerText = "Capture: " + (selectedTaskObj.subTask || selectedTaskObj.task);
        document.getElementById("proofModal").style.display = "block";
        
        document.getElementById("proofFile").value = "";
        document.getElementById("photoPreview").style.display = "none";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("uploadLabel").style.display = "block";
      }

      function openAdhocProofModal(index) {
        selectedTaskObj = extraTasks[index];
        selectedTaskObj.isAdhocModal = true;
        document.getElementById("modalHeading").innerText = "📸 Capture Proof";
        document.getElementById("modalTaskTitle").innerText = "Capture: Extra Task";
        document.getElementById("proofModal").style.display = "block";
        
        document.getElementById("proofFile").value = "";
        document.getElementById("photoPreview").style.display = "none";
        document.getElementById("uploadBtn").style.display = "none";
        document.getElementById("uploadLabel").style.display = "block";
      }

      function closeModal() { document.getElementById("proofModal").style.display = "none"; selectedTaskObj = null; }

      function showPhotoPreview(event) {
        if(event.target.files.length > 0) {
          var reader = new FileReader();
          reader.onload = function(e){
            var preview = document.getElementById('photoPreview');
            preview.src = e.target.result;
            preview.style.display = 'block';
            
            document.getElementById("uploadBtn").style.display = "block";
            document.getElementById("uploadLabel").style.display = "none";
          };
          reader.readAsDataURL(event.target.files[0]);
        }
      }

      function confirmSubmitProof() {
        var uploadBtn = document.getElementById("uploadBtn");
        var fileInput = document.getElementById("proofFile");
        if (fileInput.files.length > 0) {
          var file = fileInput.files[0];
          var reader = new FileReader();
          reader.onload = function(e) {
            var base64Data = e.target.result.split(',')[1];
            uploadBtn.innerText = "Submitting..."; uploadBtn.disabled = true;
            if (selectedTaskObj && selectedTaskObj.isAdhocModal) {
              google.script.run.withSuccessHandler(function(res) {
                selectedTaskObj.status = res.status; updatePointsUI(res.pointsEarned); closeModal(); uploadBtn.innerText = "✅ Done"; uploadBtn.disabled = false; renderStaffContent();
              }).submitTaskWithProof(loggedInUser.name, loggedInUser.role, "Ad-hoc", selectedTaskObj.task, "", selectedTaskObj.deadline, base64Data, file.type, file.name, true, selectedTaskObj.index, "Capture");
            } else {
              google.script.run.withSuccessHandler(function(res) {
                selectedTaskObj.status = res.status; updatePointsUI(res.pointsEarned); closeModal(); uploadBtn.innerText = "✅ Done"; uploadBtn.disabled = false; renderStaffContent();
              }).submitTaskWithProof(loggedInUser.name, loggedInUser.role, selectedTaskObj.type, selectedTaskObj.task, selectedTaskObj.subTask, selectedTaskObj.deadline, base64Data, file.type, file.name, false, null, "Capture");
            }
          };
          reader.readAsDataURL(file);
        } else { alert("Kripya photo capture karein!"); }
      }

      function openSopModal(encodedText) { document.getElementById("sopTextContent").innerText = decodeURIComponent(encodedText); document.getElementById("sopModal").style.display = "block"; }
      function closeSopModal() { document.getElementById("sopModal").style.display = "none"; }
      function openVideoModal(videoUrl) { 
        var url = decodeURIComponent(videoUrl);
        if(url.includes("drive.google.com/file/d/")) url = url.replace("/view", "/preview").replace("?usp=sharing", "");
        document.getElementById("sopVideoPlayer").src = url; 
        document.getElementById("videoModal").style.display = "block"; 
      }
      function closeVideoModal() { document.getElementById("sopVideoPlayer").src = ""; document.getElementById("videoModal").style.display = "none"; }

      function sendEOD() {
        var text = "Hello Sir, meri EOD Report - " + loggedInUser.name + " (" + loggedInUser.role + "). Aaj ke saare task update kar diye hain.";
        window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
      }
    </script>
  </body>
